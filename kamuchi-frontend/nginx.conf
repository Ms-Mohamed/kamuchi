server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend (optional, but good practice)
    # However, since the frontend uses http://localhost:5000 directly,
    # and the browser is where the JavaScript runs, it will still hit the host's localhost:5000.
    # We will map the backend's 5000 to the host's 5000 to maintain compatibility.
}
